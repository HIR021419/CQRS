services:
  userservice:
    image: ${DOCKER_REGISTRY-}userservice
    build:
      context: .
      dockerfile: UserService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ServiceConfig__serviceDiscoveryAddress=http://consul:8500
      - ServiceConfig__serviceAddress=http://userservice:80
      - ServiceConfig__serviceName=userservice
      - ServiceConfig__serviceId=users-1
    depends_on:
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started

  todoservice:
    image: ${DOCKER_REGISTRY-}todoservice
    build:
      context: .
      dockerfile: TodoService/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ServiceConfig__serviceDiscoveryAddress=http://consul:8500
      - ServiceConfig__serviceAddress=http://todoservice:80
      - ServiceConfig__serviceName=todoservice
      - ServiceConfig__serviceId=todos-1
    depends_on:
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  apigateway:
    image: ${DOCKER_REGISTRY-}apigateway
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    ports:
      - "5000:80"
    depends_on:
      userservice:
        condition: service_started
      todoservice:
        condition: service_started
      consul:
        condition: service_started

  consul:
    image: hashicorp/consul:latest
    command: consul agent -dev -log-level=warn -ui -client=0.0.0.0
    container_name: consul
    ports:
      - "8500:8500"
